<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acessibilidade com ARIA</title>
</head>

<body>

    <h1>Acessibilidade na Web</h1>

    <h2 id="titulo">Área do Estudante</h2>

    <section aria-labelledby="titulo">
        <p>Bem-vindo ao sistema escolar.</p>
        <button>
            <span aria-hidden="true">🔒</span>
            Acessar sistema
        </button>
    </section>

</body>
</html>
